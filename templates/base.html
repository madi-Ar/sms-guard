{% load static %}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="SMS Guard — учебный проект анализа угроз SMS-сообщений и URL.">
  <title>{% block title %}SMS Guard{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="d-flex flex-column">
<nav class="navbar navbar-expand-lg navbar-dark site-nav" aria-label="Основная навигация">
  <div class="container py-2">
    <a class="navbar-brand fw-bold d-flex gap-2 align-items-center" href="{% url 'dashboard-index' %}"><span class="brand-mark" aria-hidden="true">S</span> SMS Guard</a>
    <div class="ms-auto d-flex gap-3 align-items-center">
      <a class="nav-link text-white" href="{% url 'dashboard-index' %}">Главная</a>
      <a class="nav-link text-white-50" href="{% url 'api-health' %}">API status</a>
    </div>
  </div>
</nav>
<main class="container py-5 flex-grow-1">
  {% block content %}{% endblock %}
</main>
<footer class="site-footer container py-4 small border-top">
  <div class="d-flex flex-wrap gap-2 justify-content-between">
    <span>SMS Guard · учебный проект SIS-2305</span>
    <span>Международный университет информационных технологий</span>
  </div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
